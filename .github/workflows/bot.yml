name: Loc Binh News Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Setup Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install libraries
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Telegram Token
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ]; then
            echo "ERROR: TELEGRAM_BOT_TOKEN is missing"
            exit 1
          fi
          echo "Telegram Token OK"

      - name: Run Bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          DAILY_NEWS: ${{ github.event.schedule == '0 0 * * *' && '1' || '0' }}
        run: |
          python bot.py

      - name: Save Bot Data
        run: |
          git config user.name "loc-binh-news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Update bot data"
          git push
