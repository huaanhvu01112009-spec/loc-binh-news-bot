name: Lộc Bình News Bot

on:
  workflow_dispatch:
  schedule:
    - cron: "*/5 * * * *"
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 4

    steps:
      - name: Tải mã nguồn
        uses: actions/checkout@v4

      - name: Cài Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Cài thư viện
        run: |
          pip install -r requirements.txt

      - name: Chạy bot
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
        run: |
          python bot.py

      - name: Lưu dữ liệu bot
        run: |
          git config user.name "loc-binh-news-bot"
          git config user.email "bot@users.noreply.github.com"
          git add .
          git diff --cached --quiet || git commit -m "Update bot data"
          git push
